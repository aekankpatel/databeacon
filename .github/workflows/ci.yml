name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check databeacon evals tests sample_data
      - name: Tests
        run: pytest -q
      - name: Agent evaluation (scripted, offline)
        run: python -m evals.run --mode scripted --min-success 1.0 --out /tmp/eval-results
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: /tmp/eval-results/latest.*

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: databeacon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  live-eval:
    # Runs the full benchmark against a real LLM when credentials are configured as repository secrets.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Live evaluation
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: python -m evals.run --mode live --out /tmp/eval-results
      - uses: actions/upload-artifact@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          name: live-eval-results
          path: /tmp/eval-results/latest.*
